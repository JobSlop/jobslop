<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Italiana";src:url(Italiana-Regular.ttf)}
@font-face{font-family:"Manrope";src:url(Manrope.ttf);font-weight:200 800}
:root{--bg:#efebe3;--card:#f8f6f1;--text:#1d1b18;--muted:#6d675d;--line:#dcd6ca;--accent:#9b7b55;--good:#3f8a5a;--warn:#b0692b}
@media (prefers-color-scheme:dark){:root{--bg:#12110f;--card:#1a1916;--text:#ece7dc;--muted:#a39d91;--line:#2d2a25;--good:#4cc67f;--warn:#e0a040}}
*{box-sizing:border-box}
body{width:320px;margin:0;font:400 13.5px/1.5 Manrope,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text)}
.hero{padding:16px 18px 18px;color:#f4efe6;background:radial-gradient(260px 140px at 90% 0%,rgba(155,123,85,.4),transparent 70%),linear-gradient(160deg,#2a2620,#191714)}
.top{display:flex;align-items:center;gap:10px}
.top img{width:32px;height:32px;border-radius:9px}
.kick{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,239,230,.65)}
.kick:before{content:"✦ ";color:#c9a57a}
h1{font-family:Italiana,"Bodoni MT",serif;font-weight:400;font-size:28px;line-height:1.05;margin:10px 0 0}
main{padding:14px 18px 18px}
.state{display:flex;align-items:center;gap:8px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.dot.bad{background:var(--warn)}
p{color:var(--muted);font-size:12.5px;margin:8px 0}
input{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);text-transform:uppercase;letter-spacing:3px;font-family:Consolas,monospace;outline:none}
input:focus{border-color:var(--accent)}
button{font:inherit;font-weight:600;border:1px solid transparent;border-radius:999px;padding:10px 16px;cursor:pointer;width:100%;margin-top:10px;background:var(--text);color:var(--bg)}
button:hover{opacity:.88}
button.ghost{background:transparent;border-color:var(--line);color:var(--text);font-weight:500}
.cv{margin-top:6px;font-size:12.5px;color:var(--muted)}
#pair,#main{display:none}
kbd{font-family:Consolas,monospace;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--card)}
</style></head>
<body>
<div class="hero">
  <div class="top"><img src="icons/jf48.png" alt=""><div class="kick">jobslop</div></div>
  <h1>Autofill</h1>
</div>
<main>
  <div class="state"><span class="dot" id="dot"></span><span id="state">Checking…</span></div>
  <div class="cv" id="cv"></div>
  <div id="pair">
    <p>Open jobslop — the code is shown at the top right (🧩). Paste it here:</p>
    <input id="code" placeholder="ABCD-1234" maxlength="9">
    <button id="connect">Connect</button>
  </div>
  <div id="main">
    <button id="fill">⚡ Fill this page</button>
    <p>Works in English, Dutch, Danish, German, French, Spanish and more. Shortcut <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>F</kbd>. It never submits — always check the form and submit yourself.</p>
    <button class="ghost" id="change">Use a different code</button>
  </div>
</main>
<script src="popup.js"></script>
</body></html>
